<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should I Make Tea?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a0f;
      --gold: #d4af37;
      --gold-light: #f4d03f;
      --purple-deep: #1a1a2e;
      --orange-tea: #ff6b35;
      --text: #f5f5f5;
      --glass: rgba(255, 255, 255, 0.05);
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .ui-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      opacity: 0;
      transition: all 0.8s ease;
      width: 100%;
    }

    .ui-container.visible {
      opacity: 1;
    }

    .ui-container.animating {
      transform: translate(-50%, -80%);
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
      letter-spacing: 0.1em;
      transition: all 0.8s ease;
    }

    .title.shift-up {
      transform: translateY(-15vh);
      opacity: 0;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.6;
      margin-bottom: 2.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: opacity 0.5s ease;
    }

    .subtitle.fade-out {
      opacity: 0;
    }

    .btn-decide {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
      background: var(--glass);
      border: 2px solid var(--gold);
      color: var(--gold);
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      letter-spacing: 0.15em;
      transition: transform 0.8s ease, opacity 0.5s ease;
    }

    .btn-decide.shift-down {
      transform: translateY(15vh);
      opacity: 0;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.6;
      margin-bottom: 2.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .btn-decide {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
      background: var(--glass);
      border: 2px solid var(--gold);
      color: var(--gold);
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      letter-spacing: 0.15em;
    }

    .btn-decide::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .btn-decide:hover:not(:disabled) {
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(212, 175, 55, 0.1);
      transform: scale(1.05);
    }

    .btn-decide:hover:not(:disabled)::before {
      width: 300px;
      height: 300px;
    }

    .btn-decide:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 20;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-container.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .result-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      animation: resultPulse 2s ease-in-out infinite;
    }

    .result-text.yes {
      background: linear-gradient(135deg, var(--gold) 0%, var(--orange-tea) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 100px rgba(255, 107, 53, 0.6);
    }

    .result-text.no {
      background: linear-gradient(135deg, #4a90d9 0%, #67b8e3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 100px rgba(74, 144, 217, 0.6);
    }

    @keyframes resultPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .result-subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 2rem;
      letter-spacing: 0.3em;
    }

    .btn-again {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      padding: 0.8rem 2rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--text);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s ease;
      letter-spacing: 0.15em;
      opacity: 0;
    }

    .btn-again.visible {
      opacity: 1;
    }

    .btn-again:hover {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .loading-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loading-container.visible {
      opacity: 1;
    }

    .loading-ring {
      width: 80px;
      height: 80px;
      border: 3px solid transparent;
      border-top-color: var(--gold);
      border-right-color: var(--orange-tea);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1rem;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      opacity: 0.7;
    }

    .tea-cup {
      position: fixed;
      z-index: 5;
      opacity: 0;
      transition: all 0.8s ease;
      filter: grayscale(1);
    }

    .tea-cup.visible {
      opacity: 0.5;
      filter: grayscale(0.8);
    }

    .tea-cup.fancier {
      font-size: 8rem;
      opacity: 0;
      filter: grayscale(0) saturate(1.5);
      animation: floatAround 8s ease-in-out infinite;
    }

    .tea-cup.fancier.visible {
      opacity: 1;
      filter: grayscale(0) saturate(1.5);
    }

    .tea-cup.boring {
      font-size: 2rem;
      filter: grayscale(1) brightness(0.4);
      opacity: 0.2;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
    }

    .tea-cup.boring.visible {
      opacity: 0.2;
      filter: grayscale(1) brightness(0.4);
    }

    @keyframes floatAround {
      0% { top: 20%; left: 20%; transform: translateX(-50%) rotate(-5deg); }
      25% { top: 15%; left: 70%; transform: translateX(-50%) rotate(10deg); }
      50% { top: 60%; left: 80%; transform: translateX(-50%) rotate(-3deg); }
      75% { top: 70%; left: 25%; transform: translateX(-50%) rotate(8deg); }
      100% { top: 20%; left: 20%; transform: translateX(-50%) rotate(-5deg); }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-D_QUQr4x.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="ui-container" id="ui">
    <h1 class="title">Should I Make Tea?</h1>
    <p class="subtitle">The cosmos will decide</p>
    <button class="btn-decide" id="btn-decide">Consult the Universe</button>
  </div>

  <div class="loading-container" id="loading">
    <div class="loading-ring"></div>
    <p class="loading-text">Consulting the cosmos...</p>
  </div>

  <div class="result-container" id="result">
    <div class="result-text" id="result-text"></div>
    <p class="result-subtitle" id="result-subtitle"></p>
    <button class="btn-again" id="btn-again">Ask Again</button>
  </div>

  <div class="tea-cup" id="tea-cup">🍵</div>

</body>
</html>
